[project]
name = "slide-tc"
version = "0.1.3"
description = "solve slide Tcaptcha"
authors = [{ name = "aioqzone" }]
maintainers = [
    { name = "aioqzone", email = "22952836+JamzumSum@users.noreply.github.com" },
]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10.0.1",
    "numpy>=1.22.3,<3",
]

[dependency-groups]
dev = ["pre-commit", "ruff"]
test = [
    "pytest>=8.2.1",
    "pytest-asyncio~=0.26.0",
    "aioqzone>=1.9.1.dev3", "pychaosvm", "tylisten"
]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[[tool.uv.index]]
name = "aioqzone-index"
url = "https://aioqzone.github.io/aioqzone-index/simple/"

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"

[tool.uv.sources]
pychaosvm = { index = "aioqzone-index" }
tylisten = { index = "PyPI" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99
